name: Build and Deploy Release

on:
  push:
    branches:
      - release
  workflow_dispatch:

concurrency:
  group: knbox-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to kylith-prod
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      IMAGE_NAME: knbox
      REMOTE_APP_DIR: /home/ubuntu/knbox
      REMOTE_DOCKER_NETWORK: kylith-production_default

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native dependencies
        run: npm rebuild better-sqlite3

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Build Docker image
        run: |
          set -euo pipefail
          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            .
          docker save "${IMAGE_NAME}:${GITHUB_SHA}" | gzip > "${IMAGE_NAME}-${GITHUB_SHA}.tar.gz"

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.KYLITH_PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.KYLITH_PROD_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload image archive
        run: |
          set -euo pipefail
          scp "${IMAGE_NAME}-${GITHUB_SHA}.tar.gz" \
            "${{ secrets.KYLITH_PROD_USER }}@${{ secrets.KYLITH_PROD_HOST }}:/tmp/${IMAGE_NAME}-${GITHUB_SHA}.tar.gz"

      - name: Deploy container
        env:
          KNBOX_KYLITH_ISSUER: ${{ secrets.KNBOX_KYLITH_ISSUER }}
          KNBOX_KYLITH_CREDENTIALS_B64: ${{ secrets.KNBOX_KYLITH_CREDENTIALS_B64 }}
        run: |
          set -euo pipefail
          ssh "${{ secrets.KYLITH_PROD_USER }}@${{ secrets.KYLITH_PROD_HOST }}" \
            "IMAGE_NAME='${IMAGE_NAME}' IMAGE_TAG='${GITHUB_SHA}' APP_DIR='${REMOTE_APP_DIR}' DOCKER_NETWORK='${REMOTE_DOCKER_NETWORK}' KNBOX_KYLITH_ISSUER='${KNBOX_KYLITH_ISSUER}' KNBOX_KYLITH_CREDENTIALS_B64='${KNBOX_KYLITH_CREDENTIALS_B64}' bash -s" <<'REMOTE'
          set -euo pipefail

          IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"
          ARCHIVE="/tmp/${IMAGE_NAME}-${IMAGE_TAG}.tar.gz"
          KYLITH_CREDENTIALS_FILE="${APP_DIR}/kylith-credentials.json"

          mkdir -p "${APP_DIR}/data"
          test -f "${APP_DIR}/.env"
          docker network inspect "${DOCKER_NETWORK}" >/dev/null
          test -n "${KNBOX_KYLITH_ISSUER}"
          test -n "${KNBOX_KYLITH_CREDENTIALS_B64}"
          printf '%s' "${KNBOX_KYLITH_CREDENTIALS_B64}" | base64 -d > "${KYLITH_CREDENTIALS_FILE}"
          chmod 600 "${KYLITH_CREDENTIALS_FILE}"

          gzip -dc "${ARCHIVE}" | docker load
          rm -f "${ARCHIVE}"

          docker rm -f "${IMAGE_NAME}" >/dev/null 2>&1 || true
          docker run -d \
            --name "${IMAGE_NAME}" \
            --restart unless-stopped \
            --network "${DOCKER_NETWORK}" \
            --env-file "${APP_DIR}/.env" \
            -e KNBOX_DATA_DIR=/data \
            -e KNBOX_PUBLIC_URL=https://box.beforeve.com \
            -e KNBOX_FILES_PUBLIC_URL=https://b.beforeve.com \
            -e KNBOX_KYLITH_ISSUER="${KNBOX_KYLITH_ISSUER}" \
            -e KNBOX_KYLITH_CREDENTIALS_FILE=/run/secrets/kylith-credentials.json \
            -e PORT=6789 \
            -v "${APP_DIR}/data:/data" \
            -v "${KYLITH_CREDENTIALS_FILE}:/run/secrets/kylith-credentials.json:ro" \
            "${IMAGE}"

          healthy=0
          set +e
          for attempt in $(seq 1 30); do
            docker exec "${IMAGE_NAME}" wget -qO- http://127.0.0.1:6789/ >/dev/null
            status="$?"
            if [ "${status}" = "0" ]; then
              healthy=1
              break
            fi
            sleep 2
          done
          set -e

          if [ "${healthy}" != "1" ]; then
            docker ps -a --filter "name=^/${IMAGE_NAME}$" >&2
            docker logs --tail 100 "${IMAGE_NAME}" >&2
            exit 1
          fi

          docker exec -i "${IMAGE_NAME}" node - <<'NODE'
          const http = require("node:http");
          http.get("http://127.0.0.1:6789/api/auth/config", (res) => {
            let body = "";
            res.setEncoding("utf8");
            res.on("data", (chunk) => { body += chunk; });
            res.on("end", () => {
              try {
                const parsed = JSON.parse(body);
                process.exit(parsed?.kylithSso?.enabled === true ? 0 : 1);
              } catch {
                process.exit(1);
              }
            });
          }).on("error", (error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

          docker exec -i "${IMAGE_NAME}" node - <<'NODE'
          const http = require("node:http");
          const req = http.request({
            hostname: "127.0.0.1",
            port: 6789,
            path: "/api/auth/config",
            headers: { Host: "b.beforeve.com" },
          }, (res) => {
            res.resume();
            res.on("end", () => process.exit(res.statusCode === 404 ? 0 : 1));
          });
          req.on("error", (error) => {
            console.error(error);
            process.exit(1);
          });
          req.end();
          NODE

          box_auth="$(curl -sS https://box.beforeve.com/api/auth/config)"
          printf '%s' "${box_auth}" | grep -q '"enabled":true'
          b_status="$(curl -sS -o /tmp/knbox-b-domain-check -w '%{http_code}' https://b.beforeve.com/api/auth/config)"
          test "${b_status}" = "404"
          b_missing_status="$(curl -sS -o /tmp/knbox-b-missing-check -w '%{http_code}' https://b.beforeve.com/u/missing-release-check)"
          test "${b_missing_status}" = "404"

          docker image prune -f >/dev/null || true
          REMOTE
